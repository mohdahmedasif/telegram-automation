name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and update on VPS
    # Runs on your VPS runner (label: self-hosted). No SSH key required.
    runs-on: self-hosted
    steps:
      - name: Deploy (git pull + install + restart)
        run: |
          set -euo pipefail
          APP_DIR="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$APP_DIR" ]; then
            APP_DIR="$GITHUB_WORKSPACE"
          fi
          if [ -d "$APP_DIR/.git" ]; then
            cd "$APP_DIR"
          elif [ -d "$HOME/telegram-automation/.git" ]; then
            cd "$HOME/telegram-automation"
          else
            echo "Set DEPLOY_PATH secret to your repo folder on the VPS."
            exit 1
          fi
          bash scripts/deploy.sh
