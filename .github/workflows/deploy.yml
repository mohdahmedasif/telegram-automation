name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            cd "$APP_DIR"

            echo "==> Fetching latest main"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            if [ -d .venv ]; then
              # shellcheck disable=SC1091
              . .venv/bin/activate
            elif [ -f venv/bin/activate ]; then
              # shellcheck disable=SC1091
              . venv/bin/activate
            fi

            echo "==> Installing dependencies"
            pip install -r requirements.txt

            echo "==> Restarting service"
            if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files | grep -q '^relay.service'; then
              sudo systemctl restart relay
              sudo systemctl --no-pager --full status relay || true
            elif [ -f scripts/restart.sh ]; then
              bash scripts/restart.sh
            else
              echo "No relay.service or scripts/restart.sh found."
              echo "Pulled code successfully; restart the app manually this once,"
              echo "or install deploy/relay.service (see README)."
              exit 1
            fi

            echo "==> Deploy complete"
