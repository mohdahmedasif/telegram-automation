name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${SSH_KEY:-}" ]; then
            echo "DEPLOY_SSH_KEY is empty. Set it with:"
            echo "  Get-Content -Raw \$env:USERPROFILE\\.ssh\\github-actions | gh secret set DEPLOY_SSH_KEY"
            exit 1
          fi

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY is not a valid private key."
            echo "Set it from the key FILE (do not paste):"
            echo "  Get-Content -Raw \$env:USERPROFILE\\.ssh\\github-actions | gh secret set DEPLOY_SSH_KEY"
            exit 1
          fi
          echo "SSH private key OK"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /home/runner/.ssh/deploy_key
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            bash scripts/deploy.sh
