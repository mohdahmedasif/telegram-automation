name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and update on VPS
    # Runs on your VPS (label: self-hosted). Uses scripts/deploy.sh only.
    runs-on: self-hosted
    steps:
      - name: Deploy (git pull + install + restart)
        run: |
          set -euo pipefail
          APP_DIR="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$APP_DIR" ]; then
            APP_DIR="$HOME/telegram-automation"
          fi
          if [ -d "$APP_DIR/.git" ]; then
            cd "$APP_DIR"
          elif [ -d "$GITHUB_WORKSPACE/.git" ]; then
            cd "$GITHUB_WORKSPACE"
          else
            echo "Set DEPLOY_PATH to your repo folder on the VPS."
            exit 1
          fi
          bash scripts/deploy.sh
